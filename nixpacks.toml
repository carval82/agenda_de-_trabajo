# Solo PHP — evita que Nixpacks ejecute npm run build
providers = ["php"]

[phases.setup]
nixPkgs = [
  "php82",
  "php82Packages.composer",
  "php82Extensions.pdo",
  "php82Extensions.pdo_pgsql",
  "php82Extensions.pdo_sqlite",
  "php82Extensions.mbstring",
  "php82Extensions.openssl",
  "php82Extensions.curl",
  "php82Extensions.zip",
  "php82Extensions.bcmath",
  "php82Extensions.fileinfo",
  "php82Extensions.tokenizer",
  "php82Extensions.ctype",
  "php82Extensions.dom",
  "php82Extensions.xml",
  "php82Extensions.simplexml",
]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction"]

# La UI web usa Tailwind/FullCalendar por CDN — no requiere Node/npm
[phases.build]
cmds = ["echo 'Skip npm build: frontend served via CDN'"]

[start]
cmd = "sh scripts/start-railway.sh"
